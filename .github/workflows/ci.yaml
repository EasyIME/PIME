# CI workflow for PIME
# Calls the reusable build-and-sign workflow with different signing policies:
#   - CI builds (non-tag): test-signing, no approval required
#   - Release builds (tag): release-signing, requires production environment approval

name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  ci:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    uses: ./.github/workflows/build-and-sign.yaml
    with:
      signing-policy: test-signing
    secrets: inherit

  go-backend:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go-backend/go.mod

      - name: Build and test go-backend
        working-directory: go-backend
        run: |
          go build -v ./...
          go test -count=1 -skip TestRealRime ./...

  release:
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/build-and-sign.yaml
    with:
      signing-policy: release-signing
      environment: production
      create-release: true
    secrets: inherit
